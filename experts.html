<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f6f4">
<title>BIRT Lab | TERMIS Asia-Pacific 2028</title>
<meta name="description" content="Express your interest in TERMIS Asia-Pacific 2028 as a speaker, reviewer, panel member or collaborator.">
<style>
:root{--teal:#0b7771;--ink:#0e1d1f;--orange:#ff8200;--paper:#f2f6f4}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink)}
#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.scene{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 95px;text-align:center;gap:12px}
.logos{display:flex;align-items:center;justify-content:center;gap:clamp(22px,5vw,80px);width:min(1060px,100%)}.brand{flex:1.3;min-width:0;animation:enterLeft .48s cubic-bezier(.2,1.3,.3,1) both}.birt{font-size:clamp(54px,10vw,135px);font-weight:900;letter-spacing:-.095em;line-height:.95;white-space:nowrap}.birt span{color:var(--teal)}.tagline{font-size:clamp(9px,1.35vw,17px);font-weight:700;letter-spacing:.1em;color:var(--teal);margin-top:13px}
.separator{height:130px;width:2px;background:linear-gradient(transparent,#9ebdb6,transparent);animation:grow .35s .25s both}.termis{flex:1;min-width:0;animation:enterRight .48s cubic-bezier(.2,1.3,.3,1) both}.support{font-size:clamp(10px,1.3vw,14px);font-weight:800;letter-spacing:.24em;color:#697c7c;margin-bottom:12px}.termis img{mix-blend-mode:multiply;display:block;width:100%;max-width:380px;height:auto;margin:auto}.year{font-size:clamp(34px,5.8vw,70px);font-weight:900;letter-spacing:.07em;color:var(--orange);line-height:1.05;margin-top:5px}
.headline{margin:40px 0 0;font-size:clamp(24px,4.3vw,54px);font-weight:900;letter-spacing:-.04em;animation:pop .4s .55s both}.headline em{font-style:normal;color:var(--teal)}.roles{font-size:clamp(12px,1.8vw,18px);color:#516567;font-weight:600;animation:pop .4s .78s both}.bar{position:absolute;bottom:76px;width:min(360px,75vw);height:5px;background:#d7e4e0;border-radius:20px;overflow:hidden}.bar:before{content:"";display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--orange));animation:fill 2.5s linear forwards}.loading{position:absolute;bottom:96px;font-size:10px;font-weight:800;letter-spacing:.2em;color:#657979}.skip{position:absolute;bottom:24px;padding:10px 23px;border:1px solid #93b3ad;border-radius:40px;background:white;color:var(--teal);font-weight:800;cursor:pointer}.skip:focus-visible{outline:3px solid var(--orange)}.scene.exit{animation:leave .28s forwards}
@keyframes enterLeft{from{opacity:0;transform:translateX(-140px) scale(.65);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes enterRight{from{opacity:0;transform:translateX(140px) scale(.65);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.92)}to{opacity:1;transform:none}}@keyframes fill{to{width:100%}}@keyframes leave{to{opacity:0;transform:scale(.96);filter:blur(5px)}}
@media(max-width:650px){.scene{padding-top:35px}.logos{flex-direction:column;gap:19px}.brand,.termis{flex:none;width:100%}.birt{font-size:clamp(64px,16vw,110px)}.tagline{font-size:10px}.separator{width:65%;height:1px;background:linear-gradient(90deg,transparent,#9ebdb6,transparent)}.termis img{max-width:235px}.year{font-size:48px}.support{margin-bottom:7px}.headline{margin-top:15px}.roles{max-width:310px;line-height:1.6}}
/* TERMIS logo and 2028 side by side */
.termis-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
}

.termis-row img {
  display: block;
  width: 68%;
  max-width: 290px;
  height: auto;
  object-fit: contain;
  mix-blend-mode: normal;
}

.termis-row .year {
  font-size: clamp(38px, 5vw, 68px);
  font-weight: 900;
  color: #ff8200;
  letter-spacing: -0.04em;
  line-height: 1;
  margin: 0;
  white-space: nowrap;
}

/* Mobile layout */
@media (max-width:650px) {
  .termis-row {
    gap: 8px;
  }

  .termis-row img {
    width: 62%;
    max-width: 220px;
  }

  .termis-row .year {
    font-size: clamp(34px, 9vw, 52px);
  }
}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<main class="scene" id="scene">
  <div class="logos">
    <section class="brand" aria-label="BIRT Lab">
      <div class="birt">BIRT<span>LAB</span></div>
      <div class="tagline">ENGINEERING LIFE THROUGH TECHNOLOGY</div>
    </section>
    <div class="separator" aria-hidden="true"></div>
<section class="termis" aria-label="TERMIS Asia-Pacific 2028">
  <div class="support">SUPPORTING</div>

  <div class="termis-row">
    <img src="termis-ap.png" alt="TERMIS Asia-Pacific logo">
    <div class="year">2028</div>
  </div>

</section>
  </div>
  <h1 class="headline">Be Part of <em>TERMIS-AP 2028</em></h1>
  <div class="roles">Speakers · Reviewers · Panels · Collaborators</div>
  <div class="loading">OPENING REGISTRATION</div>
  <div class="bar" aria-hidden="true"></div>
  <button class="skip" id="skip" type="button">SKIP INTRO →</button>
</main>
<script>
(()=>{
  const destination='expert-form.html';let leaving=false;
  function go(){if(leaving)return;leaving=true;document.getElementById('scene').classList.add('exit');setTimeout(()=>location.replace(destination),280)}
  document.getElementById('skip').addEventListener('click',go);
  setTimeout(go,2500);
  const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let w,h,pts=[];
  function resize(){const dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);pts=Array.from({length:Math.min(90,Math.floor(w/13))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,r:1+Math.random()*2.6,c:Math.random()<.28?'#ff8200':'#0b7771'}))}
  function frame(){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.globalAlpha=.45;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=.12;ctx.strokeStyle='#0b7771';for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y;if(dx*dx+dy*dy<10000){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}ctx.globalAlpha=1;requestAnimationFrame(frame)}
  resize();addEventListener('resize',resize);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)frame();
})();
</script>
</body>
</html>
