
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIRT Lab | Expert Network</title>
<meta name="theme-color" content="#f2f6f4">

<style>
:root {
  --ink:#0e1d1f;
  --teal:#0b7771;
  --aqua:#5cc5bf;
  --violet:#7759a6;
  --paper:#f2f6f4;
}
* { box-sizing:border-box; }
html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}
body {
  font-family:Arial,Helvetica,sans-serif;
  background:var(--paper);
  color:var(--ink);
}
canvas {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
.flash {
  position:fixed;
  inset:0;
  z-index:4;
  background:white;
  pointer-events:none;
  animation:flashOut .55s ease-out forwards;
}
@keyframes flashOut {
  0% { opacity:1; }
  100% { opacity:0; }
}
.center {
  position:absolute;
  z-index:5;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:24px;
}
.logo {
  font-size:clamp(75px,16vw,180px);
  font-weight:900;
  letter-spacing:-.095em;
  line-height:1;
  opacity:0;
  transform:scale(2.2);
  animation:logoIn .55s cubic-bezier(.15,1.5,.35,1)
    .12s forwards;
}
.logo span { color:var(--teal); }
@keyframes logoIn {
  0% {
    opacity:0;
    transform:scale(2.2);
    filter:blur(12px);
  }
  70% {
    opacity:1;
    filter:blur(0);
  }
  100% {
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}
.slogan {
  font-size:clamp(14px,2.5vw,24px);
  color:var(--teal);
  font-weight:700;
  letter-spacing:.07em;
  margin-top:22px;
  opacity:0;
  transform:translateY(30px);
  animation:rise .35s ease-out .55s forwards;
}
.sub {
  margin-top:18px;
  font-size:clamp(12px,1.5vw,16px);
  color:#667779;
  letter-spacing:.12em;
  opacity:0;
  animation:rise .35s ease-out .8s forwards;
}
@keyframes rise {
  to { opacity:1;transform:translateY(0); }
}
.ring {
  position:absolute;
  width:min(72vw,650px);
  height:min(72vw,650px);
  border:2px solid rgba(11,119,113,.18);
  border-radius:50%;
  opacity:0;
  animation:ringBlast 1.5s ease-out .2s forwards;
  pointer-events:none;
}
.ring.two {
  animation-delay:.38s;
  border-color:rgba(119,89,166,.2);
}
.ring.three {
  animation-delay:.55s;
  border-style:dashed;
}
@keyframes ringBlast {
  0% { transform:scale(.15) rotate(0);opacity:1; }
  65% { opacity:.8; }
  100% { transform:scale(1.6) rotate(160deg);opacity:0; }
}
.progress {
  position:absolute;
  bottom:85px;
  width:min(320px,75vw);
  height:4px;
  background:#d9e5e1;
  border-radius:5px;
  overflow:hidden;
}
.progress div {
  height:100%;
  width:0;
  background:var(--teal);
  animation:load 2.5s linear forwards;
}
@keyframes load {
  to { width:100%; }
}
.status {
  position:absolute;
  bottom:110px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.15em;
  color:#667779;
}
.skip {
  position:absolute;
  z-index:10;
  bottom:28px;
  background:none;
  border:1px solid #9fb9b3;
  padding:11px 24px;
  border-radius:30px;
  color:var(--teal);
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.skip:hover {
  background:var(--teal);
  color:white;
}
.exit {
  animation:exit .28s ease-in forwards;
}
@keyframes exit {
  to { opacity:0;transform:scale(.92);filter:blur(8px); }
}
@media(prefers-reduced-motion:reduce) {
  .logo,.slogan,.sub {
    animation:none;
    opacity:1;
    transform:none;
  }
  .ring { display:none; }
}
</style>
</head>

<body>
<canvas id="particles"></canvas>
<div class="flash"></div>

<div class="center" id="scene">
  <div class="ring"></div>
  <div class="ring two"></div>
  <div class="ring three"></div>

  <div class="logo">BIRT<span>LAB</span></div>
  <div class="slogan">ENGINEERING LIFE THROUGH TECHNOLOGY</div>
  <div class="sub">EXPERT • REVIEWER • COLLABORATOR NETWORK</div>

  <div class="status">CONNECTING TO BIRT LAB</div>
  <div class="progress"><div></div></div>
  <button class="skip" id="skip">SKIP INTRO →</button>
</div>

<script>
(function(){
  "use strict";

  const DESTINATION = "expert-form.html";
  const DURATION = 2500;
  let navigating = false;

  function go() {
    if(navigating) return;
    navigating = true;
    document.getElementById("scene").classList.add("exit");
    setTimeout(function(){
      window.location.replace(DESTINATION);
    },280);
  }

  document.getElementById("skip")
    .addEventListener("click",go);

  setTimeout(go,DURATION);

  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let w=0,h=0;

  function resize(){
    w=window.innerWidth;
    h=window.innerHeight;
    canvas.width=w*devicePixelRatio;
    canvas.height=h*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    particles=Array.from({length:Math.min(95,Math.floor(w/12))},()=>({
      x:Math.random()*w,
      y:Math.random()*h,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      r:1+Math.random()*3,
      color:Math.random()>.8?"#7759a6":"#0b7771"
    }));
  }

  function animate(){
    ctx.clearRect(0,0,w,h);

    for(const p of particles){
      p.x+=p.vx;
      p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color;
      ctx.globalAlpha=.5;
      ctx.fill();
    }

    ctx.globalAlpha=.13;
    ctx.strokeStyle="#0b7771";

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i],b=particles[j];
        const dx=a.x-b.x,dy=a.y-b.y;
        if(dx*dx+dy*dy<12000){
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }

    ctx.globalAlpha=1;
    requestAnimationFrame(animate);
  }

  resize();
  window.addEventListener("resize",resize);

  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    animate();
  }
})();
</script>
</body>
</html>
