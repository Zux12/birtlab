name: BIRT Lab Research Digest - Build Weekly Edition
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 0' # Sunday 18:00 MYT
permissions:
  contents: write
concurrency:
  group: birt-research-digest
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate verified research edition
        run: node scripts/generate-research-digest.cjs
      - name: Commit archive and latest edition
        run: |
          git config user.name "BIRT Lab Digest Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-digest-issues/ research-digest-latest.html research-digest-data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate weekly BIRT Lab Research Digest"
            git push
          fi
