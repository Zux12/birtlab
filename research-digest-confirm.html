<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm Research Digest Subscription | BIRT Lab</title><style>body{font:16px/1.6 Arial,sans-serif;background:#eff6f7;color:#113449;margin:0}.wrap{max-width:560px;margin:10vh auto;padding:36px;background:#fff;border-top:5px solid #008a90;box-shadow:0 8px 40px #0b304711}h1{font-size:27px}button{background:#007e86;color:white;border:0;border-radius:7px;padding:13px 23px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}a{color:#007e86}</style></head><body><main class="wrap"><div style="font-weight:900;font-size:23px">BIRT<span style="color:#008a90">LAB</span></div><h1>Confirm your Research Digest subscription</h1><p>Confirm that you wish to receive the weekly BIRT Lab Research Digest. This link expires after 48 hours.</p><button id="confirm">Confirm subscription</button><p id="status" role="status"></p><a href="https://birtlab.com/research-digest.html">Back to Research Digest</a></main><script>const button=document.getElementById('confirm'),status=document.getElementById('status');button.onclick=async()=>{const token=new URLSearchParams(location.search).get('token');if(!token){status.textContent='Invalid confirmation link.';return}button.disabled=true;status.textContent='Confirming...';try{const r=await fetch('https://mterm2026-559f9bf571b5.herokuapp.com/api/birt/newsletter/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to confirm');status.textContent='Your subscription is confirmed. Thank you!';button.hidden=true;history.replaceState(null,'',location.pathname)}catch(e){status.textContent=e.message;button.disabled=false}};</script></body></html>
