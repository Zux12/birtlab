nsent').checked})});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to subscribe');status.textContent='Your subscription request has been processed. \ Thank you for joining BIRT Lab Research Digest.';f.reset()}catch(err){status.textContent=err.message}finally{btn.disabled=false}};</script></body></html>
